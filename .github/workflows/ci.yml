name: Community CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Test, vet, format, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          failed=0
          while IFS= read -r file; do
            formatted="$(mktemp)"
            gofmt "$file" > "$formatted"
            if ! diff --strip-trailing-cr --brief "$file" "$formatted" >/dev/null; then
              echo "$file needs gofmt"
              failed=1
            fi
            rm -f "$formatted"
          done < <(git ls-files '*.go')
          exit "$failed"

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build Community CLI
        run: go build -trimpath -o observer ./cmd/cli

      - name: Verify executable
        run: ./observer version
