# Observer security and health scan. Reports are preserved even when the final gate fails.
name: Observer Scan

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  observer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build Observer
        run: go build -o observer ./cmd/cli

      - name: Run audit
        id: audit
        continue-on-error: true
        run: >-
          ./observer analyze .
          --out observer-report.html
          --json observer-findings.json
          --sarif observer.sarif
          --attest observer-attestation.json
          --fail-on High

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observer-audit-${{ github.sha }}
          if-no-files-found: warn
          path: |
            observer-report.html
            observer-findings.json
            observer.sarif
            observer-attestation.json
            observer-attestation.json.sig

      - name: Upload SARIF
        if: always() && hashFiles('observer.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: observer.sarif

      - name: Enforce audit result
        if: always() && steps.audit.outcome == 'failure'
        run: |
          echo "Observer audit failed or was incomplete. Reports were uploaded above."
          exit 1