# Observer security & health scan.
#
# Builds Observer from source, scans the repository, writes SARIF, and uploads
# it to GitHub code scanning — which surfaces findings in the Security tab AND
# annotates pull requests inline (no extra PR-comment tooling needed).
#
# This file also serves as a copy-paste template. To scan YOUR project without
# building from source, see docs/CI.md (download the released binary instead).

name: Observer Scan

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  security-events: write   # required to upload SARIF

jobs:
  observer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build Observer
        run: go build -o observer ./cmd/cli

      - name: Scan
        # --fail-on trips the quality gate; continue-on-error lets the SARIF
        # upload run even when the gate fails, so findings still reach the
        # Security tab / PR. Drop continue-on-error to hard-fail the build.
        continue-on-error: true
        run: ./observer analyze . --sarif observer.sarif --fail-on High

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: observer.sarif
